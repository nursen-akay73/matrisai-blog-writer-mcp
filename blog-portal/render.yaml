# Render Blueprint — blog-portal
# Dashboard: New → Blueprint → bu repo
# veya Web Service: Root Directory = blog-portal

services:
  - type: web
    name: matriks-mcp-blog-portal
    runtime: node
    plan: free
    rootDir: blog-portal
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
